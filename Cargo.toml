[package]
name = "galileo-rs"
version = "0.5.0"
edition = "2024"
description = "Galileo computer algebra system, in Rust"
license = "Apache-2.0"
repository = "https://github.com/cascala/galileo"

[lib]
name = "galileo_rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "galileo"
path = "src/bin/galileo.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The test suite runs the factoring lab and other number crunching with time
# budgets; unoptimized big-integer code is 10-50x slower and makes those tests
# flaky. Optimize dependencies always, and our own code lightly.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "19.0.0"
